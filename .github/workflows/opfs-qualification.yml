name: Packed OPFS qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/browser-opfs.mjs"
      - "scripts/copy-assets.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/opfs-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opfs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opfs:
    name: Chromium and WebKit OPFS on macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Record tested checkout and runner
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p opfs-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE' > opfs-evidence/provenance.json
          import { execFileSync } from "node:child_process";
          console.log(JSON.stringify({
            testedSha: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            eventSha: process.env.GITHUB_SHA,
            runnerImage: process.env.ImageOS,
            runnerImageVersion: process.env.ImageVersion,
            runnerArchitecture: process.arch,
            node: process.version,
            npm: execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(),
            macOS: execFileSync("sw_vers", [], { encoding: "utf8" }).trim(),
          }, null, 2));
          NODE
      - name: Install locked tools and browsers
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/playwright-core/cli.js install chromium webkit
          node --input-type=module <<'NODE' > opfs-evidence/playwright.json
          import { readFileSync } from "node:fs";
          import { chromium, webkit } from "playwright-core";
          console.log(JSON.stringify({
            playwright: JSON.parse(readFileSync("node_modules/playwright-core/package.json", "utf8")).version,
            browserRevisions: JSON.parse(readFileSync("node_modules/playwright-core/browsers.json", "utf8")),
            chromiumExecutable: chromium.executablePath(),
            webkitExecutable: webkit.executablePath(),
          }, null, 2));
          NODE
      - name: Run packed consumer against actual OPFS
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          npm run test:browser:opfs 2>&1 | tee opfs-evidence/browser-opfs.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: opfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: opfs-evidence/
          if-no-files-found: error
